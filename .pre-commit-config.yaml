repos:
  - repo: local
    hooks:
      - id: format-check
        name: Check formatting
        entry: corepack pnpm format:check
        language: system
        pass_filenames: false
      - id: lint
        name: Lint source
        entry: corepack pnpm lint
        language: system
        pass_filenames: false
        files: '\.(ts|tsx)$'
      - id: type-check
        name: Check types
        entry: corepack pnpm exec tsc --noEmit
        language: system
        pass_filenames: false
        files: '\.(ts|tsx)$'
